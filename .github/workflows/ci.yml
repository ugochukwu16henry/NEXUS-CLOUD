name: CI

on:
  pull_request:
  # Every branch, so a pushed branch shows red or green before it becomes a pull request.
  push:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are cancelled; every commit on main still gets a full run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.101.0

jobs:
  # Gates G1 (static) and G2 (tests) from the test strategy.
  verify:
    name: Static checks, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: No server-only secrets in browser bundle
        run: pnpm check:bundle-secrets

  # Gate G2: migrations apply cleanly, RLS policies hold (pgTAP), generated types are current.
  database:
    name: Migrations and RLS tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase db start
      - name: pgTAP policy tests
        run: supabase test db
      - name: Generated database types match the migrations
        run: |
          supabase gen types typescript --local --schema public > /tmp/database.types.ts
          diff -u packages/db/src/database.types.ts /tmp/database.types.ts || {
            echo "::error file=packages/db/src/database.types.ts::Types are stale. Run: pnpm --filter @nexus/db gen:types"
            exit 1
          }

  # Gate G4 (system): E2E journeys, accessibility and security headers against a real local stack.
  e2e:
    name: E2E and accessibility
    needs: [verify, database]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Start Supabase (database, auth, API, storage, mail)
        run: supabase start -x imgproxy,realtime,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - run: pnpm install --frozen-lockfile
      - name: Write local env for the web app
        run: node scripts/write-local-env.mjs owner@nexus.test
      # NEXT_PUBLIC_* values are inlined at build time, so build after the env exists.
      - run: pnpm --filter @nexus/web build
      - name: No server-only secret values in browser-facing output
        run: node --env-file=apps/web/.env.local scripts/check-bundle-secrets.mjs
      - name: Integration tests (webhook processor against local Supabase)
        run: pnpm --filter @nexus/integrations test:int
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
