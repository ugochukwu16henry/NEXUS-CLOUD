name: Deploy migrations to one Supabase project

# Reusable job for deploy-database.yml. Reads SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_ID and
# SUPABASE_DB_PASSWORD from the GitHub environment named by `environment`.
on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      required:
        description: When false, a missing environment is skipped with a notice instead of failing.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  deploy:
    name: Apply migrations (${{ inputs.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      TARGET: ${{ inputs.environment }}
      REQUIRED: ${{ inputs.required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check secrets are configured
        id: secrets
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            if [ "$REQUIRED" = "true" ]; then
              echo "::error title=Missing secrets::Add these to the '$TARGET' environment:$missing"
              exit 1
            fi
            echo "::notice title=$TARGET not configured::Skipping $TARGET. Add$missing to the '$TARGET' environment to deploy there (docs/runbooks/staging.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Shape checks catch common paste mistakes without revealing the values.
          if ! [[ "$SUPABASE_PROJECT_ID" =~ ^[a-z]{20}$ ]]; then
            echo "::error title=SUPABASE_PROJECT_ID looks wrong::Use only the 20-letter project ref (the part before .supabase.co), not the URL."
            exit 1
          fi
          if [[ "$SUPABASE_ACCESS_TOKEN" != sbp_* ]]; then
            echo "::error title=SUPABASE_ACCESS_TOKEN looks wrong::Use a personal access token (starts with sbp_) from Account preferences → Access Tokens, not a project API key."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - if: steps.secrets.outputs.configured == 'true'
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.101.0
      - name: Link project
        if: steps.secrets.outputs.configured == 'true'
        run: |
          if ! supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" > link.log 2>&1; then
            cat link.log
            # GitHub masks secret values in this output, so the error can be shown as an annotation.
            echo "::error title=supabase link failed::$(tail -n 4 link.log | tr '\n' ' ')"
            exit 1
          fi
      - name: Show pending migrations
        if: steps.secrets.outputs.configured == 'true'
        run: |
          supabase migration list --linked
          supabase db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Apply migrations
        if: steps.secrets.outputs.configured == 'true'
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
      - name: Summarise deployed migrations
        if: steps.secrets.outputs.configured == 'true'
        run: |
          {
            echo "### Migrations on $TARGET"
            echo '```'
            supabase migration list --linked
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
