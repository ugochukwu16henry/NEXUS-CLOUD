name: Deploy database

# Applies new migrations when they reach main: first proven on a fresh local database (pgTAP), then
# applied to staging, then to production. Each target is a GitHub environment, so production can
# require approval for every run (blueprint: human approval for production schema changes).
# Staging is skipped with a notice until its environment exists (docs/runbooks/staging.md).
# No secrets are passed in: each deploy job reads only its own GitHub environment's secrets.
on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - .github/workflows/deploy-database.yml
      - .github/workflows/_deploy-supabase.yml
  workflow_dispatch:

# Never run two schema deployments at once, and never cancel one halfway.
concurrency:
  group: deploy-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test migrations on a fresh database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.101.0
      - run: supabase db start
      - run: supabase test db

  staging:
    needs: verify
    uses: ./.github/workflows/_deploy-supabase.yml
    with:
      environment: staging
      required: false

  production:
    needs: staging
    uses: ./.github/workflows/_deploy-supabase.yml
    with:
      environment: production
      required: true
