name: Deploy database

# Applies new migrations when they reach main: first proven on a fresh local database (pgTAP), then
# applied to staging, then to production. Each deploy job declares its GitHub environment, so it
# reads only that environment's secrets, and production can require approval for every run
# (blueprint: human approval for production schema changes). Staging is skipped with a notice until
# its environment exists (docs/runbooks/staging.md).
on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - .github/workflows/deploy-database.yml
      - .github/actions/supabase-deploy/**
  workflow_dispatch:

# Never run two schema deployments at once, and never cancel one halfway.
concurrency:
  group: deploy-database
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Test migrations on a fresh database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.101.0
      - run: supabase db start
      - run: supabase test db

  staging:
    name: Apply migrations (staging)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/supabase-deploy
        with:
          target: staging
          required: "false"
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          project-id: ${{ secrets.SUPABASE_PROJECT_ID }}
          db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}

  production:
    name: Apply migrations (production)
    needs: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: ./.github/actions/supabase-deploy
        with:
          target: production
          access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          project-id: ${{ secrets.SUPABASE_PROJECT_ID }}
          db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
