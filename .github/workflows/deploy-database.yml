name: Deploy database

# Applies new migrations to the hosted Supabase project when they reach main. Each run first proves
# the migrations on a fresh local database (pgTAP), then pushes them through the `production`
# GitHub environment, where you can require approval for every run (blueprint: human approval for
# production schema changes).
on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
      - .github/workflows/deploy-database.yml
  workflow_dispatch:

# Never run two schema deployments at once, and never cancel one halfway.
concurrency:
  group: deploy-database
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_CLI_VERSION: 2.101.0

jobs:
  verify:
    name: Test migrations on a fresh database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - run: supabase db start
      - run: supabase test db

  deploy:
    name: Apply migrations to hosted Supabase
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - name: Check secrets are configured
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these to the 'production' environment:$missing"
            exit 1
          fi
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Show pending migrations
        run: supabase migration list --linked
      - name: Apply migrations
        run: supabase db push --linked --password "$SUPABASE_DB_PASSWORD"
