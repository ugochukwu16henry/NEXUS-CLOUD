<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070b14" />
    <title>Offline · Nexus Cloud</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #070b14;
        color: #e6edf7;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }
      img {
        width: 72px;
        height: 72px;
      }
      h1 {
        font-size: 20px;
        margin: 16px 0 8px;
      }
      p {
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.5;
        max-width: 22rem;
      }
      a {
        display: inline-block;
        margin-top: 16px;
        padding: 10px 18px;
        border-radius: 8px;
        background: #2dd4bf;
        color: #04121a;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Nexus Cloud needs a connection to reach your projects. Your work is safe on the server.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
