# Nexus AI Hub database (customer zone, ADR 0015). Hosted on its own Supabase project and deployed
# by .github/workflows/deploy-hub-database.yml with `--workdir apps/hub-api`. Locally the Hub's
# tests use a throwaway database on the main stack instead (apps/hub-api/README.md), so the ports
# below only matter if this project is ever started on its own; they avoid the Nexus Cloud stack's.
project_id = "nexus-ai-hub"

[api]
port = 55321

[db]
port = 55322
shadow_port = 55320
major_version = 17

[studio]
port = 55323

[inbucket]
port = 55324

[analytics]
enabled = false
